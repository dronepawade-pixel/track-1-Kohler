            - paragraph [ref=f176e197]: Bring the freshness and convenience of personal cleansing to your existing toilet with the KOHLER PureWash E525 elongated bidet toilet seat. Warm water cleansing blends with a slim, low-profile design that fits most elongated toilets, so upgrading your routine feels effortless. Choose front or rear wash modes, then fine-tune the water temperature and pressure until every moment feels just right. A hybrid heater keeps the water continuously warm, delivering consistent comfort from the first use to the last. The self-cleaning stainless steel wand uses UV light to automatically clean its surfaces, giving you one less thing to think about. When it is time to tidy up, the Quick-Release™ feature lets you lift the seat away for easy cleaning, while Grip-Tight bumpers hold everything firmly in place. The Quiet-Close™ lid and seat lower gently on their own, never with a slam. For anyone seeking a warm water bidet that pairs everyday comfort with thoughtful design, the PureWash E525 makes personal cleansing a pleasure.
